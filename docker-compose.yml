services:
  mariadb:
    image: mariadb:11.8   # >= 11.3: o dump usa a collation utf8mb4_uca1400_ai_ci
    container_name: nlab_dw_mariadb
    restart: unless-stopped
    command:
      - "--max_allowed_packet=128M"
      - "--innodb-buffer-pool-size=512M"
    ports:
      - "${NLAB_DB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${NLAB_DB_PASSWORD:?defina NLAB_DB_PASSWORD no arquivo .env}
      MARIADB_DATABASE: nlab_db
    volumes:
      - mariadb_dw_data:/var/lib/mysql
      - ./seeds/sample_oltp.sql:/docker-entrypoint-initdb.d/01-sample_oltp.sql:ro,z   # ",z" = rótulo SELinux (Fedora/RHEL)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mariadb_dw_data:
